<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:;" />
<title>Clawd</title>
<link rel="stylesheet" href="pet.css" />
</head>
<body class="size-m">
  <div id="hud" class="hit" aria-label="Uso do plano">
    <div class="head" id="headline"></div>
    <div class="row" id="r-s"><span class="lbl">5h</span><span class="bar"><i class="fill"></i><i class="tick"></i></span><span class="val">--</span><span class="ico"></span></div>
    <div class="row" id="r-w"><span class="lbl">sem</span><span class="bar"><i class="fill"></i><i class="tick"></i></span><span class="val">--</span><span class="ico"></span></div>
  </div>

  <div id="pet" class="hit idle">
    <div id="fx"></div>
    <svg id="clawd" viewBox="0 0 16 10" shape-rendering="crispEdges" aria-label="Clawd">
      <g id="sprite">
        <g id="legs">
          <rect class="b leg la" x="3" y="7" width="1" height="2" />
          <rect class="b leg lb" x="5" y="7" width="1" height="2" />
          <rect class="b leg la" x="10" y="7" width="1" height="2" />
          <rect class="b leg lb" x="12" y="7" width="1" height="2" />
        </g>
        <g id="body">
          <rect class="b" x="2" y="0" width="12" height="7.2" />
          <rect class="b arm al" x="0" y="3" width="2" height="2" />
          <rect class="b arm ar" x="14" y="3" width="2" height="2" />
          <g id="eyes" class="eyes">
            <rect class="eye" x="5" y="2" width="1" height="2" />
            <rect class="eye" x="10" y="2" width="1" height="2" />
          </g>
          <g id="eyes-sleep" class="eyes">
            <rect class="eye" x="4.4" y="3.2" width="2" height="0.5" />
            <rect class="eye" x="9.6" y="3.2" width="2" height="0.5" />
          </g>
          <g id="eyes-happy" class="eyes">
            <rect class="eye" x="4.6" y="3" width="0.6" height="0.6" /><rect class="eye" x="5.2" y="2.4" width="0.6" height="0.6" /><rect class="eye" x="5.8" y="3" width="0.6" height="0.6" />
            <rect class="eye" x="9.6" y="3" width="0.6" height="0.6" /><rect class="eye" x="10.2" y="2.4" width="0.6" height="0.6" /><rect class="eye" x="10.8" y="3" width="0.6" height="0.6" />
          </g>
          <g id="eyes-ko" class="eyes">
            <rect class="eye" x="4.6" y="2.1" width="0.6" height="0.6" /><rect class="eye" x="5.8" y="2.1" width="0.6" height="0.6" /><rect class="eye" x="5.2" y="2.7" width="0.6" height="0.6" /><rect class="eye" x="4.6" y="3.3" width="0.6" height="0.6" /><rect class="eye" x="5.8" y="3.3" width="0.6" height="0.6" />
            <rect class="eye" x="9.6" y="2.1" width="0.6" height="0.6" /><rect class="eye" x="10.8" y="2.1" width="0.6" height="0.6" /><rect class="eye" x="10.2" y="2.7" width="0.6" height="0.6" /><rect class="eye" x="9.6" y="3.3" width="0.6" height="0.6" /><rect class="eye" x="10.8" y="3.3" width="0.6" height="0.6" />
          </g>
        </g>
      </g>
    </svg>
  </div>
  <script src="pet.js"></script>
</body>
</html>
